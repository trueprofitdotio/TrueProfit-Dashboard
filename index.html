      :root { color-scheme: light; }

        white-space: nowrap;
        max-width: 100%;
      }
      .marquee-content {
        display: inline-block;
      }
      /* Only animate if the content is wider than the container */
      .marquee-container:hover .marquee-content {
        padding-right: 2rem; /* Add space at end of scroll */
        animation: marquee 8s linear infinite;
      }

      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-100%); }
      }

    THESIS: An affiliate desk read as a chart recorder's paper rather than a dashboard of cards — a ruled measuring ground with an ink trace laid over it. It refuses the rounded-card KPI grid every analytics tool ships.
    OWN-WORLD: Cool engineering graph paper as the ground; opaque white sheets with 4px corners, hairline rules and almost no shadow; Archivo for lettering, Roboto Mono for every figure; one indigo pen, #4954BC, and nothing else decorative.
    STORY: A team parks this on a second monitor all day and sees, in one glance, whether today moved and which partner moved it.
    FIRST VIEWPORT: A flat ruled bar; a filter strip pinned beneath it; then one continuous instrument strip of five readouts divided by hairlines — not five cards — above the five-channel daily trace plotted straight onto the grid, one pen per measure.
