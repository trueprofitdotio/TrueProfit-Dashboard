    <style>
      :root {
        --accent-color: #23C48C;
        --header-blue: #2236ba;
        --shadow-color: rgba(100, 116, 139, 0.1);
        --border-color-light: #f1f5f9; /* slate-100 */
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F8F9FA;
      }
      .card {
         background-color: white;
         border: 1px solid rgba(191, 219, 254, 0.5);
         border-radius: 0.5rem;
      }
      .primary-btn {
        transition: background-color 0.2s ease-out;
      }
      input, select, button, .btn {
        border-radius: 5px !important;
      }
      /* Eliminate browser-default focus outlines globally (e.g. for canvas, focused divs, etc. to prevent black border flash) */
      *:focus, input:focus, select:focus, button:focus, canvas:focus, div:focus {
        outline: none !important;
        box-shadow: none !important;
      }
      .marquee-container {
        overflow: hidden;
        white-space: nowrap;
        max-width: 100%;
      }
      .marquee-content {
        display: inline-block;
      }
      /* Only animate if the content is wider than the container */
      .marquee-container:hover .marquee-content {
        padding-right: 2rem; /* Add space at end of scroll */
        animation: marquee 8s linear infinite;
      }

      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-100%); }
      }

      /* Premium smooth transition animation for active tab content */
      @keyframes fadeInSlideUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .tab-content-active {
        animation: fadeInSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
